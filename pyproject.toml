[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-credit-intelligence"
version = "0.1.0"
description = "Research foundation for causal analysis of credit-limit interventions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
app = ["streamlit>=1.28", "plotly>=5.18"]
test = ["pytest>=7.4"]
ml = ["scikit-learn>=1.3", "xgboost>=2.0"]
causal = ["econml>=0.15", "doubleml>=0.7"]
benchmark = ["xlrd>=2.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
